# سوالات طلایی — سنجه‌ی کیفیت رصام.
#
# با `python scripts/evaluate.py` اجرا می‌شوند و درصد موفقیت را می‌دهند. بدون
# این عدد، هر تغییری در پرامپت یک قمار است: نمی‌دانیم بهتر شد یا بدتر.
#
# جواب‌ها از خودِ دیتابیس گرفته شده‌اند، نه از حدس. اگر داده عوض شد، این فایل
# هم باید دوباره از دیتابیس به‌روز شود.
#
# هر سوال یکی از این سه شرط پذیرش را دارد:
#   value: <عدد>   جواب عددی، با تلورانس پیش‌فرض ۰٫۰۱ یا مقدار صریح tolerance
#   empty: true    کوئری درست باید نتیجه‌ی خالی بدهد
#   message: true  باید جمله‌ی فارسی بدهد، نه کوئری

# --- تجمیع ساده ---
- question: میانگین دمای داخلی اینورترها چقدر است؟
  expect: {value: 28.6077, tolerance: 0.01}

- question: بیشترین دمای داخلی اینورتر چقدر بوده؟
  expect: {value: 56.9}

- question: میانگین ولتاژ متوسط پنل فشار ضعیف چقدر است؟
  expect: {value: 227.4365, tolerance: 0.01}

- question: بیشترین توان استرینگ‌ها چقدر بوده؟
  expect: {value: 9845.0}

- question: چند رکورد در پنل فشار متوسط ثبت شده است؟
  expect: {value: 21122}

# --- تله‌ی عدد بدون‌علامت ۳۲بیتی ---
- question: میانگین توان راکتیو اینورتر چقدر است؟
  expect: {value: -27.3142, tolerance: 0.01}
  trap: مقدار منفی به‌صورت بدون‌علامت ذخیره شده؛ بدون تبدیل، جواب ۲٫۵ میلیارد است

- question: بیشترین توان راکتیو اینورتر چقدر بوده؟
  expect: {value: 25}
  trap: بدون تبدیل علامت، جواب همیشه ۴۲۹۴۹۶۷۲۹۵ است

# --- تله‌ی واژگان فارسی ---
- question: مصرف پنل فشار ضعیف چقدر است؟
  expect: {value: 195.0711, tolerance: 0.01}
  trap: «مصرف» یعنی توان اکتیو، نه کنتورهای انرژی

# --- تله‌ی کنتور در برابر اندازه‌گیری ---
- question: تولید انرژی روز آخر اینورتر چقدر بوده؟
  expect: {value: 592.8, tolerance: 0.5}
  trap: کنتور روزانه است؛ بیشینه‌ی آخرین روز، نه جمع

# --- الگوی «آخرین» ---
- question: آخرین توان اکتیو پنل فشار متوسط چقدر است؟
  expect: {value: 9.6}
  trap: مرتب‌سازی نزولی روی timestamp و یک نتیجه

# --- تله‌ی صفرهای شبانه ---
- question: کمترین ولتاژ استرینگ‌ها که صفر نباشد چقدر است؟
  expect: {value: 101.7}
  trap: شب‌ها ولتاژ صفر ثبت می‌شود و باید کنار گذاشته شود

# --- فیلد متنی، نه بولی ---
- question: چند رکورد اینورتر در حالت کاری Standby ثبت شده است؟
  expect: {value: 3309}

- question: در چند رکورد اینورتر، mccb برابر no_conn بوده است؟
  expect: {value: 9}
  trap: mccb رشته است نه بولی

# --- نتیجه‌ی خالی، که جوابِ درست است ---
- question: لیست خطاهای رخ داده در اینورترها را نشان بده
  expect: {empty: true}
  trap: fa_al_code در همه‌ی داکیومنت‌ها صفر است؛ خالی بودن همان جواب است

# --- بیرون از دیتابیس ---
- question: تابش خورشید امروز چقدر بوده است؟
  expect: {message: true}
  trap: این داده اصلاً در دیتابیس نیست؛ مدل نباید فیلد از خودش بسازد
