name = "rasam-product"
main = "worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/downloads/*", "/release.json", "/plans.json"]
not_found_handling = "404-page"

[observability]
enabled = false

[vars]
CATALOG_URL = "https://rasam-admin.nova-dd625a.workers.dev/api/public/plans"

[[services]]
binding = "CATALOG"
service = "rasam-admin"
