name = "rasam-workspace"
main = "worker.js"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/internal/*"]

[vars]
BACKEND_URL = ""

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "rasam-organizations"
# پیش از استقرار، شناسهٔ پایگاه تازه را با ابزار Cloudflare تنظیم کنید.
database_id = "REPLACE_WITH_ORGANIZATIONS_DATABASE_ID"
migrations_dir = "migrations"
