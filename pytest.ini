# پوشه‌ی تست‌ها هم‌شکل پوشه‌ی کد است (tests/core، tests/databases/mongodb، …).
# importlib یعنی دو فایل تست با نام یکسان در دو پوشه با هم تداخل نمی‌کنند، و
# pythonpath یعنی تست‌ها بدون دست‌بردن در sys.path بسته‌ی `rasam` را می‌بینند.
[pytest]
testpaths = tests
pythonpath = .
addopts = --import-mode=importlib
